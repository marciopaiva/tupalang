[package]
name = "tupa-engine"
version = "0.9.3"
edition = "2021"
description = "Tupã pipeline executor (channels, constraint solver)"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"
homepage = "https://github.com/marciopaiva/tupalang"
documentation = "https://docs.rs/tupa-engine"
readme = "README.md"

[dependencies]
tupa-core = { path = "../tupa-core", version = "0.9.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async"] }
serde = { version = "1.0", features = ["derive"] }

[[bench]]
name = "engine_bench"
harness = false
