[package]
name = "{{crate_name}}"
version = "0.9.0"
edition = "2021"
description = "Tupã policy pipeline"
license = "Apache-2.0"
authors = ["{{authors}}"]

[dependencies]
tupa-core = "0.9"
tupa-engine = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
