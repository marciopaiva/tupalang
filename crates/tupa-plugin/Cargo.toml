[package]
name = "tupa-plugin"
version = "0.8.2"
edition = "2021"
description = "Dynamic plugin loading for TupaLang step functions"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libloading = "0.8"
tupa-runtime = { path = "../tupa-runtime", version = "0.8.2" }
tupa-codegen = { path = "../tupa-codegen", version = "0.8.2" }

[dev-dependencies]
tempfile = "3"

[features]
default = []