[package]
name = "tupa-plugin"
version = "0.9.2"
edition = "2021"
description = "Dynamic plugin loading for Tupã step functions (tupa-engine compatible)"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"
homepage = "https://github.com/marciopaiva/tupalang"
documentation = "https://docs.rs/tupa-plugin"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libloading = "0.8"
tupa-core = { path = "../tupa-core", version = "0.9.2" }
tupa-engine = { path = "../tupa-engine", version = "0.9.2" }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async"] }
serde = { version = "1.0", features = ["derive"] }

[features]
default = []