[package]
name = "cargo-tupa"
version = "0.9.0"
edition = "2021"
description = "Cargo subcommand for Tupã language tooling"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"
homepage = "https://github.com/marciopaiva/tupalang"
documentation = "https://docs.rs/cargo-tupa"
readme = "README.md"

[[bin]]
name = "cargo-tupa"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tupa-core = { path = "../tupa-core" }
tupa-engine = { path = "../tupa-engine" }
tupa-lint = { path = "../tupa-lint" }
tupa-fmt = { path = "../tupa-fmt" }
tupa-parser = { path = "../tupa-parser" }
tupa-plugin = { path = "../tupa-plugin" }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
which = "6.0"
walkdir = "2.0"

[dev-dependencies]
tempfile = "3"
