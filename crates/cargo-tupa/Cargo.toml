[package]
name = "cargo-tupa"
version = "0.9.5"
edition = "2021"
description = "Cargo subcommand for Tupã Rust-DSL pipelines"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"
homepage = "https://github.com/marciopaiva/tupalang"
documentation = "https://docs.rs/cargo-tupa"
readme = "README.md"

[[bin]]
name = "cargo-tupa"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tupa-core = { path = "../tupa-core", version = "0.9.5" }
tupa-engine = { path = "../tupa-engine", version = "0.9.5" }
tupa-plugin = { path = "../tupa-plugin", version = "0.9.5" }
which = "6.0"
walkdir = "2.0"
tempfile = "3.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
glob = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
