[package]
name = "tupa-conformance"
version = "0.8.2"
edition = "2021"
description = "Conformance test runner for TupaLang"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"
homepage = "https://github.com/marciopaiva/tupalang"
documentation = "https://github.com/marciopaiva/tupalang/wiki"
readme = "README.md"
publish = false

[dependencies]
tupa-parser = { path = "../tupa-parser" }
tupa-typecheck = { path = "../tupa-typecheck" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
insta = { version = "1.42", features = ["yaml"] }
