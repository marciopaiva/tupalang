[package]
name = "tupa-core"
version = "0.9.4"
edition = "2021"
description = "Core types and pipeline definition macro for Tupã"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"
homepage = "https://github.com/marciopaiva/tupalang"
documentation = "https://docs.rs/tupa-core"
readme = "README.md"

[dependencies]
tupa-core-macros = { path = "../tupa-core-macros", version = "0.9.4" }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
