[package]
name = "tupa-pyffi"
version = "0.10.0"
edition = "2021"
description = "Python FFI bindings for Tupã — call Python functions from pipelines"
license = "Apache-2.0"
repository = "https://github.com/marciopaiva/tupalang"
homepage = "https://github.com/marciopaiva/tupalang"
documentation = "https://docs.rs/tupa-pyffi"
readme = "README.md"

[dependencies]
pyo3 = { version = "0.21", features = ["auto-initialize"] }
serde_json = "1.0"
once_cell = "1.19"
tupa-core = { path = "../tupa-core", version = "0.10.0" }
tupa-engine = { path = "../tupa-engine", version = "0.10.0" }

[dev-dependencies]
# Add test dependencies if needed
