name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-core:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish core crates in dependency order
        shell: bash
        run: |
          set -euo pipefail
          MODE="--locked"
          if [[ "${{ github.event.inputs.dry_run || 'false' }}" == "true" ]]; then
            MODE="--locked --dry-run"
          fi

          publish_crate() {
            local crate="$1"
            echo "Publishing $crate ($MODE)"

            set +e
            OUTPUT=$(cargo publish -p "$crate" $MODE 2>&1)
            CODE=$?
            set -e

            echo "$OUTPUT"

            if [[ $CODE -eq 0 ]]; then
              if [[ "$MODE" != *"--dry-run"* ]]; then
                sleep 30
              fi
              return 0
            fi

            if [[ "$OUTPUT" == *"already exists on crates.io index"* ]]; then
              echo "Skipping $crate: already published"
              return 0
            fi

            return $CODE
          }

          # 0.9.3 — Rust-DSL era: core -> engine -> plugin -> pyffi -> cargo-tupa
          for crate in \
            tupa-core-macros \
            tupa-core \
            tupa-engine \
            tupa-plugin \
            tupa-pyffi \
            cargo-tupa; do
            publish_crate "$crate"
          done

          # All legacy crates removed from workspace (0.8.x frozen, publish=false)
