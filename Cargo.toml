[workspace]
members = [
    # Legacy crates (deprecated, frozen at 0.8.x)
    "crates/tupa-lexer",
    "crates/tupa-parser",
    "crates/tupa-typecheck",
    "crates/tupa-codegen",   # kept for tupa-plugin dependency
    "crates/tupa-runtime",  # kept for tupa-plugin dependency
    "crates/tupa-effects",  # kept for typecheck deps
    # Active crates (maintained)
    "crates/tupa-audit",
    "crates/tupa-conformance",
    "crates/tupa-fmt",
    "crates/tupa-lint",
    "crates/tupa-plugin",   # needs migration to tupa-engine
    "crates/tupa-pyffi",    # Phase 3 (prototype)
    # NEW: crate-first core (alpha)
    "crates/tupa-core-macros",  # proc-macro for pipeline!
    "crates/tupa-core",
    "crates/tupa-engine",
    # CLI tools
    "crates/cargo-tupa",
]
resolver = "2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "fat"

[workspace.metadata.tupa]
python-min-version = "3.9"
pytorch-min-version = "2.0"
