[workspace]
members = [
    # Active crates (0.9.x — Rust-DSL era)
    "crates/tupa-core-macros",
    "crates/tupa-core",
    "crates/tupa-engine",
    "crates/tupa-plugin",
    "crates/tupa-pyffi",
    "crates/cargo-tupa",
    "crates/tupa-lints",
]
resolver = "2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "fat"

[workspace.metadata.tupa]
python-min-version = "3.9"
pytorch-min-version = "2.0"
